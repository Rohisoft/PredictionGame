services:
  mongo:
    image: mongo:7
    container_name: prediction-game-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    # A replica set (even a single-node one) is required for the
    # multi-document transactions placeBet/settleRound/adminAddPoints use —
    # a plain standalone mongod does not support them at all.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: mongosh --quiet --eval "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: initiates the replica set on first run, then exits. Safe to
  # leave running every `docker compose up` — it just prints "already
  # initialized" on subsequent runs.
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo:27017 --quiet --eval
      "try { rs.status(); print('already initialized'); } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); print('initiated'); }"

volumes:
  mongo_data:
